version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # protoc-gen-es v2 emits both messages and the service schema in one file
  # (no separate protoc-gen-connect-es needed: @connectrpc/connect's
  # createClient consumes that schema directly). Invoked by its exact path
  # in frontend/node_modules/.bin rather than by bare name or npx, so
  # `buf generate` fails loudly with "no such file" if `npm ci --prefix
  # frontend` has not run, instead of silently skipping the TS output or
  # resolving some other version off the network.
  - local: frontend/node_modules/.bin/protoc-gen-es
    out: frontend/src/gen
    opt: target=ts
